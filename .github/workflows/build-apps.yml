name: Build apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build APK
        run: |
          mkdir -p app/www
          cp -r index.html app.js logo.js style.css manifest.webmanifest sw.js icon-*.png images libs app/www/
          cd app
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share
          npx cap init "Ad ZoneX Billing" in.adzonex.billing --web-dir www
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
